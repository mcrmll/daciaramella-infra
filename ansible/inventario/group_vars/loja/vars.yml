# Versão da app no servidor (D10): a tag do Git, construída com construir.sh --release <tag>.
# Fazer deploy é mudar esta linha, correr o deploy.yml e commitar só se correu bem.
app_tag: v0.1.0

# Imagens de terceiros, fixadas pelo digest e trazidas do Mac pelo infra/scripts/imagens-base.sh (P4, D17).
# Para atualizar: mudar as versões no script, corrê-lo e copiar para aqui as três linhas que ele mostra.
imagens_base_ficheiro: base-2026-10-23.tar.zst
#   postgres:17.11-alpine  sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
#   caddy:2.11.7-alpine    sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
postgres_imagem: daciaramella/postgres:17.11-eee6c6e1b089
caddy_imagem: daciaramella/caddy:2.11.7-eb4d35b7452d

# A app no servidor (compose.yml.j2, P5). O servidor de testes emite na conta de testes da Moloni.
faturacao_emissao_ativa: 1 # interruptor da emissão: 0 pausa a faturação (P8)
faturacao_real_ativa: 0 # faturas reais: sempre 0 no servidor de testes
moloni_http_ativo: 1
backup_hora: "04:30"
retencao_local: 30
# Pasta dos backups na R2 (Q1): teste_loja enquanto o servidor estiver na bancada; loja quando for para a loja.
rclone_remote: r2:daciaramella-backups/teste_loja

# No Mac: onde o construir.sh deixa as imagens e os playbooks deixam os logs (logs/).
release_dir: "{{ lookup('env', 'HOME') }}/daciaramella-releases"

# Nome da app na rede da loja (D11), resolvido pelo router (P3). Usado no Caddyfile e no MOLONI_ORIGEM_GESTAO (P5).
app_nome: app.figaro.local

# Janela de manutenção desligada no servidor de testes (D15). Liga-se quando o servidor for para a loja.
janela_ativa: false

# Password do sudo do servidor, guardada no Vault (D16).
ansible_become_password: "{{ vault_become_password }}"

# No Ubuntu 26.04, o `sudo` é o sudo-rs, e o become do Ansible não reconhece a pergunta da password dele
# (timeout). O sudo clássico está instalado como `sudo.ws` e lê as mesmas regras (/etc/sudoers).
ansible_become_exe: sudo.ws
