# Envia um ficheiro de imagens do Mac para o servidor e carrega-o, se faltar alguma imagem (P6, P7).
# Incluído pelo deploy.yml, uma vez por ficheiro. Recebe a variável envio: nome, ficheiro e imagens.
# Se as imagens já estiverem no servidor (por exemplo, para voltar a uma das últimas versões), não
# precisa do ficheiro no Mac.

- name: "{{ envio.nome }}: as imagens já estão no servidor?"
  ansible.builtin.command:
    argv: "{{ ['docker', 'image', 'inspect'] + envio.imagens }}"
  register: envio_inspect
  changed_when: false
  failed_when: false
  check_mode: false

- name: "{{ envio.nome }}: enviar e carregar"
  when: envio_inspect.rc != 0
  block:
    - name: "{{ envio.nome }}: o ficheiro existe no Mac"
      ansible.builtin.stat:
        path: "{{ release_dir }}/{{ envio.ficheiro }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: envio_local

    - name: "{{ envio.nome }}: o sha256 bate certo com o .sha256 ao lado"
      ansible.builtin.assert:
        that:
          - envio_local.stat.exists
          - envio_local.stat.checksum == lookup('ansible.builtin.file', release_dir ~ '/' ~ envio.ficheiro ~ '.sha256').split()[0]
        fail_msg: >-
          As imagens {{ envio.imagens | join(', ') }} não estão no servidor, e falta {{ envio.ficheiro }}
          em {{ release_dir }} (ou está diferente do .sha256). Correr primeiro o construir.sh ou o imagens-base.sh.
        quiet: true

    - name: "{{ envio.nome }}: copiar o ficheiro para o servidor"
      ansible.builtin.copy:
        src: "{{ release_dir }}/{{ envio.ficheiro }}"
        dest: "{{ pasta_app }}/releases/{{ envio.ficheiro }}"
        owner: root
        group: root
        mode: "0600"

    - name: "{{ envio.nome }}: carregar as imagens (docker load)"
      ansible.builtin.shell:
        cmd: set -o pipefail && zstd -dc {{ (pasta_app ~ '/releases/' ~ envio.ficheiro) | quote }} | docker load
        executable: /bin/bash

  always:
    # O servidor fica só com as imagens carregadas, nunca com os ficheiros.
    - name: "{{ envio.nome }}: apagar o ficheiro do servidor"
      ansible.builtin.file:
        path: "{{ pasta_app }}/releases/{{ envio.ficheiro }}"
        state: absent
