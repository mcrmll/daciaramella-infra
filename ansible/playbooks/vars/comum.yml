# Variáveis partilhadas pelos playbooks da app (deploy.yml, repor-copia.yml e faturacao.yml).
pasta_app: /opt/daciaramella
pasta_raiz_caddy: "{{ pasta_app }}/caddy/data/caddy/pki/authorities/local"
# psql dentro do contentor do Postgres, ligado à BD "postgres" (para poder copiar e trocar a daciaramella).
psql: [docker, compose, exec, -T, postgres, psql, -U, daciaramella, -d, postgres, -v, ON_ERROR_STOP=1, -tAc]
# Corta as ligações que ainda houver à daciaramella: o CREATE … TEMPLATE e o RENAME exigem que não haja nenhuma.
sql_cortar_ligacoes: >-
  SELECT count(pg_terminate_backend(pid)) FROM pg_stat_activity
  WHERE datname = 'daciaramella' AND pid <> pg_backend_pid()
